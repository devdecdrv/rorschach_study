name: Build rorschach_study

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $dll = Get-ChildItem -Recurse build -Filter "*.dll" | Select-Object -First 1
          $exe = Get-ChildItem -Recurse build -Filter "*.exe" | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName dist\ }
          if ($exe) { Copy-Item $exe.FullName dist\ }
          Compress-Archive -Path dist\* -DestinationPath rorschach_study.zip

      - name: Upload build artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: rorschach_study
          path: rorschach_study.zip
          retention-days: 30

      - name: Create GitHub Release + upload zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "rorschach_study build ${{ github.run_number }}"
          draft: false
          prerelease: false
          files: rorschach_study.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
